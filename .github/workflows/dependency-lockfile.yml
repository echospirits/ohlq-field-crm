name: Validate dependency lockfile

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lockfile.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Match the data-load runner and catch incomplete lockfiles before the
      # next scheduled import. This check needs no application credentials.
      - run: npm ci --ignore-scripts --no-audit --no-fund
