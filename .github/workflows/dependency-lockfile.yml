name: Validate dependency lockfile
on:
  create:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-0153-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bacf7433e8b524776ce2312f746311006e3d9e9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate exact candidate on Node 22 and npm 10
        run: |
          test "$(git rev-parse HEAD)" = "7bacf7433e8b524776ce2312f746311006e3d9e9"
          test "$(git rev-parse 'HEAD^{tree}')" = "74b1238e1649744b9053cdd6b0b46c4f2f35ddaf"
          node --version
          npm --version
          npm --version | grep '^10\.'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install prisma generate
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - name: Build production candidate
        env:
          APP_ENV: production
          APP_BASE_URL: https://crm.echospirits.com
          DATABASE_ENVIRONMENT: production
          DATABASE_TARGET_ID: inert-release-validation
          EXPECTED_DATABASE_HOST: localhost
          DATABASE_URL: postgresql://unused:unused@localhost:1/neondb
          AUTH_SECRET: inert-release-validation-secret-not-for-use
          CRON_JOBS_ENABLED: 'false'
          EMAIL_SEND_ENABLED: 'false'
          OHLQ_IMPORT_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
