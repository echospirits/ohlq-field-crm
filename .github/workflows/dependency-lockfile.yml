name: Validate dependency lockfile
on:
  create:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-monthly-0152-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67ec45ce03e6ba97864013101877fc5e32e7fc00
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate exact candidate on Node 22 and npm 10
        run: |
          test "$(git rev-parse HEAD)" = "67ec45ce03e6ba97864013101877fc5e32e7fc00"
          test "$(git rev-parse 'HEAD^{tree}')" = "f7ba3a0273820e13ac6cf664815f2cd209e74933"
          node --version
          npm --version
          npm --version | grep '^10\.'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install prisma generate
      - name: Set up Chromium for existing browser fixtures
        run: npx --no-install playwright install --with-deps chromium
      - name: Run release tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production candidate
        env:
          APP_ENV: production
          APP_BASE_URL: https://crm.echospirits.com
          DATABASE_ENVIRONMENT: production
          DATABASE_TARGET_ID: inert-release-validation
          EXPECTED_DATABASE_HOST: localhost
          DATABASE_URL: postgresql://unused:unused@localhost:1/neondb
          AUTH_SECRET: inert-release-validation-secret-not-for-use
          CRON_JOBS_ENABLED: 'false'
          EMAIL_SEND_ENABLED: 'false'
          OHLQ_IMPORT_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
