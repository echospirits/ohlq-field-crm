name: Isolated PostgreSQL Echo writer fixtures
on:
  create:
permissions:
  contents: read
jobs:
  synthetic:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-0152-synthetic-db-verified'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: synthetic_echo
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Race the actual receipt writers on disposable PostgreSQL
        env:
          APP_ENV: development
          DATABASE_ENVIRONMENT: development
          DATABASE_URL: postgresql://postgres:synthetic@localhost:5432/synthetic_echo
        run: node --import tsx scripts/check-echo-writer-race.ts
