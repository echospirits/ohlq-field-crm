name: Publish verified Neat 0.15.3
on:
  create:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-0153-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bacf7433e8b524776ce2312f746311006e3d9e9
          persist-credentials: false
      - name: Publish the verified production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/echospirits/ohlq-field-crm/branches/main --jq '.commit.sha')" = "7bacf7433e8b524776ce2312f746311006e3d9e9"
          test "$(gh api repos/echospirits/ohlq-field-crm/actions/runs/44955981025 --jq '.conclusion')" = success
          test "$(gh api repos/echospirits/ohlq-field-crm/actions/runs/44955981691 --jq '.conclusion')" = success
          gh release create v0.15.3 --repo echospirits/ohlq-field-crm --target 7bacf7433e8b524776ce2312f746311006e3d9e9 --title 'Neat 0.15.3 — Echo monthly reporting' --notes-file docs/releases/0.15.3.md
