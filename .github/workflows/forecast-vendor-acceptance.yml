name: Scoped forecast vendor acceptance

on:
  push:
    branches: [codex/forecast-vendor-acceptance]
    paths:
      - .github/workflows/forecast-vendor-acceptance.yml
      - scripts/verify-forecast-vendor.ts

permissions:
  contents: read

# Shares the normal import lock to avoid overlapping browser/source sessions.
concurrency:
  group: ohlq-annual-sales-sync-${{ github.repository == 'echospirits/neat-tst' && 'test' || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'echospirits/neat-tst' && github.ref == 'refs/heads/codex/forecast-vendor-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: test
    defaults:
      run:
        working-directory: application
    env:
      APP_ENV: test
      DATABASE_ENVIRONMENT: test
      DATABASE_TARGET_ID: ${{ vars.DATABASE_TARGET_ID }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY }}
      PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY }}
      OHLQ_MICROSOFT_USERNAME: ${{ secrets.OHLQ_MICROSOFT_USERNAME }}
      OHLQ_MICROSOFT_PASSWORD: ${{ secrets.OHLQ_MICROSOFT_PASSWORD }}
      OHLQ_BROWSER_CHANNEL: ""
      OHLQ_HEADLESS: "1"
      OHLQ_IMPORT_ENABLED: "true"
      OHLQ_USE_PERSISTENT_BROWSER_CONTEXT: "0"
      OHLQ_USE_SERVERLESS_CHROMIUM: "0"
      ACCEPTANCE_EXPECTED_APP_SHA: 1d6014037c3b30d888aaf6ae7d991b8f616aa9df
    steps:
      - name: Check out acceptance script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false
      - name: Check out exact tested application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1d6014037c3b30d888aaf6ae7d991b8f616aa9df
          path: application
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install exact application dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scoped catalog and forecast acceptance
        run: |
          mkdir -p tmp
          cp ../verification/scripts/verify-forecast-vendor.ts tmp/verify-forecast-vendor.ts
          npx tsx tmp/verify-forecast-vendor.ts

  production:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.ref == 'refs/heads/codex/forecast-vendor-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    defaults:
      run:
        working-directory: application
    env:
      APP_ENV: production
      DATABASE_ENVIRONMENT: production
      DATABASE_TARGET_ID: ${{ vars.DATABASE_TARGET_ID }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY }}
      PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY }}
      OHLQ_MICROSOFT_USERNAME: ${{ secrets.OHLQ_MICROSOFT_USERNAME }}
      OHLQ_MICROSOFT_PASSWORD: ${{ secrets.OHLQ_MICROSOFT_PASSWORD }}
      OHLQ_BROWSER_CHANNEL: ""
      OHLQ_HEADLESS: "1"
      OHLQ_IMPORT_ENABLED: "true"
      OHLQ_USE_PERSISTENT_BROWSER_CONTEXT: "0"
      OHLQ_USE_SERVERLESS_CHROMIUM: "0"
      ACCEPTANCE_EXPECTED_APP_SHA: f7188859837c9ae93fcef47547e7eb657cb40456
    steps:
      - name: Check out acceptance script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false
      - name: Check out exact production application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f7188859837c9ae93fcef47547e7eb657cb40456
          path: application
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install exact application dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scoped catalog and forecast acceptance
        run: |
          mkdir -p tmp
          cp ../verification/scripts/verify-forecast-vendor.ts tmp/verify-forecast-vendor.ts
          npx tsx tmp/verify-forecast-vendor.ts

