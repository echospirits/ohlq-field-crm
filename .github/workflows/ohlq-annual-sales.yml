name: OHLQ Annual Sales Sync

on:
  schedule:
    # Keep production at 6:47 AM Eastern and TST at 7:27 AM Eastern.
    # The first step selects the repository and daylight/standard-time slot,
    # preserving the separation between automated OHLQ browser logins.
    - cron: "47 10 * * *"
    - cron: "47 11 * * *"
    - cron: "27 11 * * *"
    - cron: "27 12 * * *"
  workflow_dispatch:
    inputs:
      reportDate:
        description: "Optional single report date to refresh, formatted YYYY-MM-DD."
        required: false
        type: string
      days:
        default: "1"
        description: "Number of recent complete report dates to run when reportDate is blank."
        required: false
        type: string
      fromDate:
        description: "Optional start date for purchase-state-only seeding, formatted YYYY-MM-DD."
        required: false
        type: string
      toDate:
        description: "Optional end date for purchase-state-only seeding, formatted YYYY-MM-DD."
        required: false
        type: string
      purchaseStateOnly:
        default: false
        description: "Update wholesale account Echo purchase state/worklist without replacing raw sales rows."
        required: false
        type: boolean
      productionSourcesOnly:
        default: false
        description: "Run only enrolled tenants' Bailment / Partner DC imports and forecast refresh."
        required: false
        type: boolean
      deploymentEnvironment:
        default: production
        description: "GitHub Environment whose isolated database and OHLQ secrets will be used."
        required: true
        type: choice
        options:
          - production
          - test
      repairTenantCredentials:
        default: false
        description: "One-time: re-encrypt one organization's OHLQ OPS credentials from this GitHub Environment."
        required: false
        type: boolean
      tenantOrganizationId:
        description: "Organization ID required when repairTenantCredentials is enabled."
        required: false
        type: string

concurrency:
  group: ohlq-annual-sales-sync-${{ github.event_name == 'schedule' && (github.repository == 'echospirits/neat-tst' && 'test' || 'production') || inputs.deploymentEnvironment }}
  cancel-in-progress: false

jobs:
  sync:
    name: Download and import OHLQ reports
    environment: ${{ github.event_name == 'schedule' && (github.repository == 'echospirits/neat-tst' && 'test' || 'production') || inputs.deploymentEnvironment }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      APP_ENV: ${{ github.event_name == 'schedule' && (github.repository == 'echospirits/neat-tst' && 'test' || 'production') || inputs.deploymentEnvironment }}
      DATABASE_ENVIRONMENT: ${{ github.event_name == 'schedule' && (github.repository == 'echospirits/neat-tst' && 'test' || 'production') || inputs.deploymentEnvironment }}
      DATABASE_TARGET_ID: ${{ vars.DATABASE_TARGET_ID }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OHLQ_OPS_USERNAME: ${{ secrets.OHLQ_OPS_USERNAME }}
      OHLQ_OPS_PASSWORD: ${{ secrets.OHLQ_OPS_PASSWORD }}
      OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY }}
      OHLQ_MICROSOFT_USERNAME: ${{ secrets.OHLQ_MICROSOFT_USERNAME }}
      OHLQ_MICROSOFT_PASSWORD: ${{ secrets.OHLQ_MICROSOFT_PASSWORD }}
      OHLQ_BROWSER_CHANNEL: ""
      OHLQ_CRON_REFRESH_DAYS: ${{ vars.OHLQ_CRON_REFRESH_DAYS || '2' }}
      OHLQ_HEADLESS: "1"
      OHLQ_IMPORT_ENABLED: "true"
      OHLQ_REPORT_RETENTION_DAYS: ${{ vars.OHLQ_REPORT_RETENTION_DAYS || '30' }}
      OHLQ_USE_PERSISTENT_BROWSER_CONTEXT: "1"
      OHLQ_USE_SERVERLESS_CHROMIUM: "0"

    steps:
      - name: Confirm scheduled fallback window
        id: schedule_window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule="$EVENT_SCHEDULE"
          eastern_offset="$(TZ=America/New_York date '+%z')"
          eastern_time="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z %z')"

          case "$REPOSITORY" in
            echospirits/ohlq-field-crm)
              daylight_schedule="47 10 * * *"
              standard_schedule="47 11 * * *"
              local_slot="6:47 AM"
              ;;
            echospirits/neat-tst)
              daylight_schedule="27 11 * * *"
              standard_schedule="27 12 * * *"
              local_slot="7:27 AM"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "reason=unrecognized repository" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$schedule" == "$daylight_schedule" && "$eastern_offset" == "-0400" ]] ||
             [[ "$schedule" == "$standard_schedule" && "$eastern_offset" == "-0500" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled $local_slot Eastern fallback at $eastern_time" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=skipping inactive repository/seasonal slot $schedule at $eastern_time" >> "$GITHUB_OUTPUT"
          fi

          echo "$eastern_time"

      - name: Check out repository
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Validate OHLQ import inputs
        id: import_inputs
        if: steps.schedule_window.outputs.should_run == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          report_date: ${{ github.event.inputs.reportDate || '' }}
          days: ${{ github.event.inputs.days || '' }}
          from_date: ${{ github.event.inputs.fromDate || '' }}
          to_date: ${{ github.event.inputs.toDate || '' }}
          purchase_state_only: ${{ github.event.inputs.purchaseStateOnly || 'false' }}
          production_sources_only: ${{ github.event.inputs.productionSourcesOnly || 'false' }}
        run: |
          if [[ -z "$days" ]]; then
            if [[ "$EVENT_NAME" == "schedule" ]]; then
              days="${OHLQ_CRON_REFRESH_DAYS:-2}"
            else
              days="1"
            fi
          fi

          for name in report_date from_date to_date; do
            value="${!name}"
            if [[ -n "$value" ]]; then
              if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
                 [[ "$(date -d "$value" '+%Y-%m-%d' 2>/dev/null)" != "$value" ]]; then
                echo "$name must be a valid YYYY-MM-DD date." >&2
                exit 1
              fi
            fi
          done

          case "$purchase_state_only" in
            true) max_days=120 ;;
            false) max_days=30 ;;
            *) echo "purchaseStateOnly must be true or false." >&2; exit 1 ;;
          esac
          case "$production_sources_only" in
            true|false) ;;
            *) echo "productionSourcesOnly must be true or false." >&2; exit 1 ;;
          esac
          if [[ "$production_sources_only" == "true" && "$purchase_state_only" == "true" ]]; then
            echo "Choose only one focused import mode." >&2
            exit 1
          fi
          if [[ ! "$days" =~ ^[1-9][0-9]{0,2}$ ]] || (( days > max_days )); then
            echo "days must be a whole number between 1 and $max_days." >&2
            exit 1
          fi

          if [[ "$purchase_state_only" == "true" && -z "$report_date" ]] &&
             [[ -n "$from_date" || -n "$to_date" ]]; then
            if [[ -z "$from_date" || -z "$to_date" || "$from_date" > "$to_date" ]]; then
              echo "Use both fromDate and toDate, with fromDate on or before toDate." >&2
              exit 1
            fi
          fi

          printf 'report_date=%s\ndays=%s\nfrom_date=%s\nto_date=%s\npurchase_state_only=%s\n' \
            "$report_date" "$days" "$from_date" "$to_date" "$purchase_state_only" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.schedule_window.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.schedule_window.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate required secrets
        id: required_secrets
        if: steps.schedule_window.outputs.should_run == 'true'
        shell: bash
        run: |
          missing=()
          for name in DATABASE_URL OHLQ_OPS_USERNAME OHLQ_OPS_PASSWORD OHLQ_MICROSOFT_USERNAME OHLQ_MICROSOFT_PASSWORD OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Report isolated target
        if: steps.schedule_window.outputs.should_run == 'true'
        run: echo "environment=${APP_ENV} databaseTarget=${DATABASE_TARGET_ID:-unlabeled} runId=${GITHUB_RUN_ID}"

      - name: Repair selected tenant OHLQ credentials
        id: credential_repair
        if: steps.schedule_window.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.repairTenantCredentials == true
        shell: bash
        env:
          TENANT_ORGANIZATION_ID: ${{ inputs.tenantOrganizationId }}
        run: |
          if [[ ! "$TENANT_ORGANIZATION_ID" =~ ^(c[a-z0-9]{24}|org_echo_spirits|org_neat_staging)$ ]]; then
            echo "Pass a generated organization CUID or an existing seeded organization ID." >&2
            exit 1
          fi
          npm run repair:ohlq-tenant-credentials -- --environment "$APP_ENV" --organization "$TENANT_ORGANIZATION_ID" --apply

      - name: Download and import current OHLQ Account Master
        id: account_master
        if: steps.schedule_window.outputs.should_run == 'true' && (github.event_name == 'schedule' || (inputs.purchaseStateOnly != true && inputs.productionSourcesOnly != true))
        timeout-minutes: 50
        run: npm run sync:ohlq-account-master -- --environment "$APP_ENV" --apply

      - name: Download and import current OHLQ Brand Master
        id: brand_master
        if: ${{ !cancelled() && steps.required_secrets.outcome == 'success' && steps.credential_repair.outcome != 'failure' && steps.schedule_window.outputs.should_run == 'true' && (github.event_name == 'schedule' || (inputs.purchaseStateOnly != true && inputs.productionSourcesOnly != true)) }}
        timeout-minutes: 15
        run: npm run sync:ohlq-brand-master -- --environment "$APP_ENV" --apply --defer-product-discovery

      - name: Run OHLQ annual sales import
        id: sales_import
        if: ${{ !cancelled() && steps.required_secrets.outcome == 'success' && steps.credential_repair.outcome != 'failure' && steps.schedule_window.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.productionSourcesOnly != true) }}
        # Multi-day recovery needs a larger budget than the daily import.
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.reportDate == '' && inputs.days != '1' && 120 || 40 }}
        shell: bash
        env:
          report_date: ${{ steps.import_inputs.outputs.report_date }}
          days: ${{ steps.import_inputs.outputs.days }}
          from_date: ${{ steps.import_inputs.outputs.from_date }}
          to_date: ${{ steps.import_inputs.outputs.to_date }}
          purchase_state_only: ${{ steps.import_inputs.outputs.purchase_state_only }}
        run: |
          if [[ "$purchase_state_only" == "true" ]]; then
            if [[ -n "$report_date" ]]; then
              npm run seed:ohlq-wholesale-purchase-state -- --date "$report_date"
            elif [[ -n "$from_date" || -n "$to_date" ]]; then
              npm run seed:ohlq-wholesale-purchase-state -- --from "$from_date" --to "$to_date"
            else
              npm run seed:ohlq-wholesale-purchase-state -- --days "$days"
            fi
          elif [[ -n "$report_date" ]]; then
            npm run backfill:ohlq-annual-sales -- --date "$report_date" --import-only
          else
            npm run backfill:ohlq-annual-sales -- --days "$days" --import-only
          fi

      - name: Download and import tenant OHLQ inventory
        id: tenant_inventory
        if: ${{ !cancelled() && steps.sales_import.outcome != 'skipped' && steps.schedule_window.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.purchaseStateOnly != true) }}
        timeout-minutes: 30
        run: npm run sync:ohlq-tenant-inventory -- --environment "$APP_ENV"

      - name: Discover organization products after core imports
        id: product_discovery
        if: ${{ !cancelled() && steps.brand_master.outcome == 'success' && steps.brand_master.outputs.imported != 'false' }}
        timeout-minutes: 10
        run: npx tsx scripts/discover-ohlq-products.ts --environment "$APP_ENV"

      - name: Download and import production forecasting sources
        id: production_sources
        if: ${{ !cancelled() && steps.required_secrets.outcome == 'success' && steps.credential_repair.outcome != 'failure' && steps.schedule_window.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.purchaseStateOnly != true) }}
        timeout-minutes: 40
        run: npm run sync:production-sources -- --environment "$APP_ENV" --apply

      - name: Refresh post-import intelligence and retention
        id: intelligence
        if: ${{ !cancelled() && steps.sales_import.outcome == 'success' && (github.event_name == 'schedule' || inputs.purchaseStateOnly != true) }}
        timeout-minutes: 100
        shell: bash
        env:
          REPORT_DATE: ${{ steps.sales_import.outputs.report_date }}
        run: |
          test -n "$REPORT_DATE"
          npm run backfill:ohlq-annual-sales -- --date "$REPORT_DATE" --intelligence-only

      - name: Generate sanitized OHLQ failure summary
        id: artifact_summary
        if: failure() && steps.schedule_window.outputs.should_run == 'true'
        env:
          OHLQ_JOB_STATUS: ${{ job.status }}
          OHLQ_ACCOUNT_MASTER_STATUS: ${{ steps.account_master.outcome }}
          OHLQ_BRAND_MASTER_STATUS: ${{ steps.brand_master.outcome }}
          OHLQ_SALES_IMPORT_STATUS: ${{ steps.sales_import.outcome }}
          OHLQ_TENANT_INVENTORY_STATUS: ${{ steps.tenant_inventory.outcome }}
          OHLQ_INTELLIGENCE_STATUS: ${{ steps.intelligence.outcome }}
          OHLQ_PRODUCT_DISCOVERY_STATUS: ${{ steps.product_discovery.outcome }}
          OHLQ_PRODUCTION_SOURCES_STATUS: ${{ steps.production_sources.outcome }}
        run: node scripts/write-ohlq-artifact-summary.cjs

      - name: Upload sanitized OHLQ failure summary
        if: failure() && steps.artifact_summary.outcome == 'success' && steps.schedule_window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ohlq-sales-status-${{ github.run_id }}
          path: ${{ runner.temp }}/ohlq-artifacts/status.json
          if-no-files-found: error
          retention-days: 1

      - name: Report skipped scheduled slot
        if: steps.schedule_window.outputs.should_run != 'true'
        env:
          SKIP_REASON: ${{ steps.schedule_window.outputs.reason }}
        run: echo "$SKIP_REASON"
