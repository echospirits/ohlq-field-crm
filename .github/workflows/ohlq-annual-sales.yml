name: Verify isolated Echo September job access
on:
  create:
permissions:
  contents: read
jobs:
  environment-check:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-september-2026-backfill'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm existing environment permits this ref
        run: printf '%s\n' 'Environment gate passed. This check reads no credentials and accesses no databases.'
