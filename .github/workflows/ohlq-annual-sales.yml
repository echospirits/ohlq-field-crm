name: Echo November duplicate evidence

on:
  create:

permissions:
  contents: read

jobs:
  worker:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.ref == 'refs/heads/codex/echo-wholesale-duplicate-diagnostic-2020' && github.event.ref_type == 'branch'
    concurrency:
      group: ohlq-annual-sales-sync-production
      queue: max
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: node scripts/retry-ohlq-command.cjs -- npm ci
      - name: Typecheck the source diagnostic
        if: github.event_name != 'workflow_dispatch'
        run: npm run typecheck
      - name: Install the existing loader's Chromium
        run: node scripts/retry-ohlq-command.cjs -- npx --no-install playwright install --with-deps chromium
      - name: Read and reconcile exact-date duplicate evidence
        id: backfill
        env:
          OHLQ_OPS_USERNAME: ${{ secrets.OHLQ_OPS_USERNAME }}
          OHLQ_OPS_PASSWORD: ${{ secrets.OHLQ_OPS_PASSWORD }}
          OHLQ_MICROSOFT_USERNAME: ${{ secrets.OHLQ_MICROSOFT_USERNAME }}
          OHLQ_MICROSOFT_PASSWORD: ${{ secrets.OHLQ_MICROSOFT_PASSWORD }}
          OHLQ_BROWSER_CHANNEL: ''
          OHLQ_HEADLESS: '1'
          OHLQ_USE_PERSISTENT_BROWSER_CONTEXT: '1'
          OHLQ_USE_SERVERLESS_CHROMIUM: '0'
        run: node --import tsx scripts/echo-wholesale-duplicate-diagnostic.ts
