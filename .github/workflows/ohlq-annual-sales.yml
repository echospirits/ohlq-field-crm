name: Verify Echo live daily receipts and publish 0.15.2
on:
  create:
permissions:
  contents: read
concurrency:
  group: ohlq-annual-sales-sync-production
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'echospirits/ohlq-field-crm' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/codex/echo-0152-live-acceptance'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48b9efc05ef78e27e2127c53e7ed4d141d33dffe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Use the deployed normal daily import path for the latest existing report date
        env:
          APP_ENV: production
          DATABASE_ENVIRONMENT: production
          DATABASE_TARGET_ID: ${{ vars.DATABASE_TARGET_ID }}
          EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          OHLQ_OPS_USERNAME: ${{ secrets.OHLQ_OPS_USERNAME }}
          OHLQ_OPS_PASSWORD: ${{ secrets.OHLQ_OPS_PASSWORD }}
          OHLQ_MICROSOFT_USERNAME: ${{ secrets.OHLQ_MICROSOFT_USERNAME }}
          OHLQ_MICROSOFT_PASSWORD: ${{ secrets.OHLQ_MICROSOFT_PASSWORD }}
          OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.OHLQ_TENANT_CREDENTIAL_ENCRYPTION_KEY }}
          PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_OPERATIONAL_CREDENTIAL_ENCRYPTION_KEY }}
          OHLQ_HEADLESS: '1'
          OHLQ_USE_PERSISTENT_BROWSER_CONTEXT: '1'
          OHLQ_USE_SERVERLESS_CHROMIUM: '0'
          OHLQ_IMPORT_ENABLED: 'true'
        run: |
          node -e 'const u=new URL(process.env.DATABASE_URL);if(!["ep-proud-recipe-amosj8m9.c-5.us-east-1.aws.neon.tech","ep-proud-recipe-amosj8m9-pooler.c-5.us-east-1.aws.neon.tech"].includes(u.hostname)||u.pathname!=="/neondb")process.exit(1)'
          npm run backfill:ohlq-annual-sales -- --date 2026-11-20 --import-only
          node --import tsx -e 'const {prisma}=require("./lib/prisma"); (async()=>{const r=await prisma.echoBottleSalesDayCoverage.findUnique({where:{reportDate:new Date("2026-11-20T00:00:00Z")}}); if(r?.sourceScope!=="COMPLETE_STATEWIDE"||r.requestReference!=="daily:"+process.env.GITHUB_RUN_ID||r.sourceSkippedRows!==0)throw Error("Missing daily receipt"); console.log(JSON.stringify({date:"2026-11-20",scope:r.sourceScope,rows:r.expectedRowCount}));})().catch(()=>{process.exitCode=1}).finally(()=>prisma.$disconnect());'
  publish:
    needs: daily
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48b9efc05ef78e27e2127c53e7ed4d141d33dffe
          persist-credentials: false
      - name: Publish the deployed production patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/echospirits/ohlq-field-crm/branches/main --jq '.commit.sha')" = "48b9efc05ef78e27e2127c53e7ed4d141d33dffe"
          gh release create v0.15.2 --repo echospirits/ohlq-field-crm --target 48b9efc05ef78e27e2127c53e7ed4d141d33dffe --title 'Neat 0.15.2 — Independent Echo bottle-sales months' --notes-file docs/releases/0.15.2.md
